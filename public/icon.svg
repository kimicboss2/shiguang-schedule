<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5A45EE"/>
      <stop offset="1" stop-color="#6B3FF0"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 日历挂环 -->
  <rect x="168" y="112" width="30" height="84" rx="15" fill="#ffffff" stroke="#5A45EE" stroke-width="6"/>
  <rect x="314" y="112" width="30" height="84" rx="15" fill="#ffffff" stroke="#5A45EE" stroke-width="6"/>
  <!-- 日历主体 -->
  <rect x="112" y="152" width="288" height="244" rx="30" fill="#ffffff"/>
  <!-- 头部与网格分隔线 -->
  <line x1="112" y1="206" x2="400" y2="206" stroke="#5A45EE" stroke-width="6"/>
  <!-- 日期格子（4-3-3 排布） -->
  <g fill="#5541EA">
    <rect x="140" y="228" width="38" height="38" rx="9"/>
    <rect x="202" y="228" width="38" height="38" rx="9"/>
    <rect x="264" y="228" width="38" height="38" rx="9"/>
    <rect x="326" y="228" width="38" height="38" rx="9"/>
    <rect x="140" y="284" width="38" height="38" rx="9"/>
    <rect x="202" y="284" width="38" height="38" rx="9"/>
    <rect x="264" y="284" width="38" height="38" rx="9"/>
    <rect x="140" y="340" width="38" height="38" rx="9"/>
    <rect x="202" y="340" width="38" height="38" rx="9"/>
    <rect x="264" y="340" width="38" height="38" rx="9"/>
  </g>
  <!-- 时钟角标 -->
  <circle cx="392" cy="366" r="66" fill="#FCCF00" stroke="#ffffff" stroke-width="10"/>
  <path d="M392 366 V 324" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
  <path d="M392 366 H 428" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
</svg>
